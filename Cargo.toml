[package]
name = "agentgateway"
version = "0.1.0"
edition = "2021"
description = "Transparent MITM proxy for AI request auditing — Rust async core"

[dependencies]
tokio = { version = "=1.41.1", features = ["full"] }
# hyper/hyper-util/http-body-util removed (C13) — manual HTTP/1.1 byte parsing used instead
rustls = "=0.23.18"
tokio-rustls = "=0.26.0"
rcgen = { version = "=0.13.2", features = ["x509-parser", "pem"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
clap = { version = "=4.5.21", features = ["derive"] }
libc = "=0.2.167"
rustls-pemfile = "=2.2.0"
time = "=0.3.37"

[profile.release]
opt-level = 3
lto = "thin"
